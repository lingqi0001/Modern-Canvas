<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Canvas</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="header-brand">
        <img src="icons/icon48.png" alt="Logo" class="header-logo">
        <div class="header-titles">
          <h1 class="header-title">Welcome to Modern Canvas</h1>
          <span class="header-subtitle">Fresh, beautiful look for your studies</span>
        </div>
      </div>
      <button type="button" class="header-settings-btn" id="btnOpenSettings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
      </button>
    </header>

    <main class="popup-body">
      <!-- 当前网址状态：一行字排在页面底上，不再单独占一张卡 -->
      <div class="status-card">
        <div class="status-indicator-row">
          <div class="status-left">
            <span class="status-dot" id="statusDot"></span>
            <span class="status-label" id="statusLabel">Checking site status...</span>
          </div>
          <div class="status-actions" id="statusActions" style="display: none;">
            <button type="button" class="btn-pause-pill" id="btnPauseToggle" title="Pause Modern Canvas">
              <span id="btnPauseText">Pause</span>
              <svg class="chevron-icon" viewBox="0 0 16 16" width="10" height="10" fill="currentColor">
                <path d="M3.2 5.8a.75.75 0 0 1 1.06-.04L8 9.27l3.74-3.5a.75.75 0 1 1 1.02 1.1l-4.25 4a.75.75 0 0 1-1.02 0l-4.25-4a.75.75 0 0 1-.04-1.07z"/>
              </svg>
            </button>
            <button type="button" class="btn-resume-pill" id="btnResume" style="display: none;">
              Resume
            </button>
          </div>
        </div>
        <div class="status-domain-text" id="statusDomain"></div>

        <!-- 暂停时长选择浮动菜单 -->
        <div class="pause-menu" id="pauseMenu" style="display: none;">
          <div class="pause-menu-title">Pause Modern Canvas for:</div>
          <button type="button" class="pause-menu-item" data-duration="30">
            <span class="pause-item-label">30 minutes</span>
            <span class="pause-item-badge">Default</span>
          </button>
          <button type="button" class="pause-menu-item" data-duration="120">
            <span class="pause-item-label">2 hours</span>
          </button>
          <button type="button" class="pause-menu-item" data-duration="reload">
            <span class="pause-item-label">Until switch / reload</span>
          </button>
          <button type="button" class="pause-menu-item" data-duration="-1">
            <span class="pause-item-label">Until turned back on</span>
          </button>
        </div>

        <button type="button" class="btn btn-primary btn-enable" id="btnEnableDomain" style="display: none;">
          <span id="btnEnableText">Enable on this site</span>
        </button>
      </div>

      <!-- 输入学校网址 -->
      <section class="section-card">
        <div class="section-title-wrap">
          <h2 class="section-title">Please enter your school's Canvas site</h2>
          <p class="section-tip">If your school uses a custom link (like .edu), enter it here to activate.</p>
        </div>

        <div class="input-group">
          <input type="text" id="manualDomainInput" placeholder="e.g. canvas.harvard.edu" spellcheck="false">
          <button type="button" class="btn btn-primary btn-add" id="btnAddManual">Add</button>
        </div>
        <div class="input-error" id="inputError" style="display: none;"></div>
      </section>

      <!-- 已支持的网址：整张列表一张卡，行本身静置不描边 -->
      <section class="section-sites">
        <div class="sites-header">
          <span class="sites-title">Active Sites</span>
          <span class="site-count" id="siteCount">1</span>
        </div>

        <ul class="domain-list" id="domainList">
          <li class="domain-item default-domain">
            <div class="domain-info">
              <span class="domain-name">*.instructure.com</span>
              <span class="domain-tag">Standard Canvas</span>
            </div>
          </li>
        </ul>
      </section>

      <!-- 当前正在阅读作业文件的提示状态行 -->
      <footer class="popup-reading-footer" id="readingFooter" style="display: none;">
        <span class="reading-pulse" aria-hidden="true"></span>
        <span class="reading-text" id="readingText"></span>
      </footer>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
